<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Clock-In System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .clock-in-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .status-card {
            transition: all 0.3s ease;
        }
        .status-card.success {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        .status-card.error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }
        .employee-info {
            display: none;
        }
        .employee-info.show {
            display: block;
        }
        .card-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .action-button {
            padding: 15px 30px;
            font-size: 1.2rem;
            min-width: 200px;
        }
        .action-button.active {
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="clock-in-container">
            <h1 class="text-center mb-4">Employee Clock-In System</h1>
            
            <div class="action-buttons">
                <button id="clockInBtn" class="btn btn-primary action-button active" onclick="setAction('clockIn')">
                    <i class="fas fa-sign-in-alt"></i> Clock In
                </button>
                <button id="clockOutBtn" class="btn btn-danger action-button" onclick="setAction('clockOut')">
                    <i class="fas fa-sign-out-alt"></i> Clock Out
                </button>
            </div>
            
            <div class="card status-card mb-4">
                <div class="card-body text-center">
                    <i class="fas fa-id-card card-icon text-primary"></i>
                    <h3 class="card-title" id="actionTitle">Ready to Clock In</h3>
                    <p class="card-text">Please tap your RFID card on the reader</p>
                </div>
            </div>

            <div class="card employee-info">
                <div class="card-body">
                    <h4 class="card-title">Employee Information</h4>
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Employee ID:</strong> <span id="employeeId"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Name:</strong> <span id="employeeName"></span></p>
                        </div>
                    </div>
                    <p><strong>Time:</strong> <span id="clockInTime"></span></p>
                    <p><strong>Status:</strong> <span id="clockStatus"></span></p>
                </div>
            </div>

            <div class="text-center mt-4">
                <a href="records.html" class="btn btn-primary">
                    <i class="fas fa-list"></i> View All Records
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const statusCard = document.querySelector('.status-card');
        const employeeInfo = document.querySelector('.employee-info');
        const employeeIdSpan = document.getElementById('employeeId');
        const employeeNameSpan = document.getElementById('employeeName');
        const clockInTimeSpan = document.getElementById('clockInTime');
        const actionTitle = document.getElementById('actionTitle');
        const clockInBtn = document.getElementById('clockInBtn');
        const clockOutBtn = document.getElementById('clockOutBtn');

        let lastProcessedTime = null; // Track the last processed clock-in time
        let currentAction = 'clockIn'; // Default action is clock in

        // Function to set the current action (clock in or clock out)
        function setAction(action) {
            currentAction = action;
            
            // Update button styles
            if (action === 'clockIn') {
                clockInBtn.classList.add('active');
                clockOutBtn.classList.remove('active');
                actionTitle.textContent = 'Ready to Clock In';
                statusCard.querySelector('.card-icon').className = 'fas fa-sign-in-alt card-icon text-primary';
            } else {
                clockInBtn.classList.remove('active');
                clockOutBtn.classList.add('active');
                actionTitle.textContent = 'Ready to Clock Out';
                statusCard.querySelector('.card-icon').className = 'fas fa-sign-out-alt card-icon text-danger';
            }
            
            // Send mode change to the server
            fetch('api/set_mode.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ mode: action })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Mode set to:', action, data);
            })
            .catch(error => {
                console.error('Error setting mode:', error);
            });
        }

        // Show welcome screen
        function showWelcomeScreen() {
            statusCard.classList.remove('success', 'error');
            
            // Set icon based on current action
            if (currentAction === 'clockIn') {
                statusCard.querySelector('.card-icon').className = 'fas fa-sign-in-alt card-icon text-primary';
                actionTitle.textContent = 'Ready to Clock In';
            } else {
                statusCard.querySelector('.card-icon').className = 'fas fa-sign-out-alt card-icon text-danger';
                actionTitle.textContent = 'Ready to Clock Out';
            }
            
            statusCard.querySelector('.card-text').textContent = 'Please tap your RFID card on the reader';
            employeeInfo.classList.remove('show');
        }

        // Function to show error state
        function showErrorState(message) {
            // If the message indicates no records found, just return to welcome screen
            if (message.includes('No active clock-in found') || message.includes('No recent clock-in records found')) {
                showWelcomeScreen();
                return;
            }
            
            // For other errors, show the error message
            statusCard.classList.remove('success');
            statusCard.classList.add('error');
            statusCard.querySelector('.card-icon').className = 'fas fa-exclamation-circle card-icon text-danger';
            statusCard.querySelector('.card-title').textContent = 'Access Denied';
            statusCard.querySelector('.card-text').textContent = message;
            employeeInfo.classList.remove('show');

            // Return to welcome screen after 3 seconds
            setTimeout(showWelcomeScreen, 3000);
        }

        // Function to update the UI with employee data
        function updateEmployeeInfo(data) {
            console.log('Received data:', data); // Debug log
            
            // Handle error state
            if (data.status === 'error') {
                console.log('Showing error state:', data.message);
                showErrorState(data.message);
                return;
            }

            // Handle success state
            if (data.employeeId) {  // Changed from checking data.uid to data.employeeId
                console.log('Processing successful action for employee:', data.employeeId);
                
                // Update last processed time based on the action
                if (currentAction === 'clockIn') {
                    lastProcessedTime = data.clockedInAt;
                } else {
                    lastProcessedTime = data.clockedOutAt;
                }

                statusCard.classList.remove('error');
                statusCard.classList.add('success');
                
                if (currentAction === 'clockIn') {
                    // Handle clock-in
                    statusCard.querySelector('.card-icon').className = 'fas fa-check-circle card-icon text-success';
                    statusCard.querySelector('.card-title').textContent = 'Successfully Clocked In!';
                    statusCard.querySelector('.card-text').textContent = 'Your clock-in has been recorded';

                    employeeIdSpan.textContent = data.employeeId;
                    employeeNameSpan.textContent = data.employeeName;
                    clockInTimeSpan.textContent = new Date(data.clockedInAt).toLocaleString();
                    document.getElementById('clockStatus').textContent = 'Clocked In';
                } else {
                    // Handle clock-out
                    statusCard.querySelector('.card-icon').className = 'fas fa-check-circle card-icon text-success';
                    statusCard.querySelector('.card-title').textContent = 'Successfully Clocked Out!';
                    statusCard.querySelector('.card-text').textContent = 'Your clock-out has been recorded';

                    employeeIdSpan.textContent = data.employeeId;
                    employeeNameSpan.textContent = data.employeeName;
                    clockInTimeSpan.textContent = new Date(data.clockedOutAt).toLocaleString();
                    document.getElementById('clockStatus').textContent = 'Clocked Out';
                }
                
                employeeInfo.classList.add('show');

                // Return to welcome screen after 5 seconds
                setTimeout(showWelcomeScreen, 5000);
            } else {
                console.log('No employee data received:', data);
            }
        }

        // Poll for new clock-in/out events
        function pollForUpdates() {
            console.log('Polling for updates...');
            
            // Determine which endpoint to call based on current action
            const endpoint = currentAction === 'clockIn' ? 'api/fetch-clockin-data.php' : 'api/clock_out.php';
            
            fetch(endpoint)
                .then(response => {
                    console.log('Response status:', response.status); // Debug log
                    return response.json();
                })
                .then(data => {
                    console.log('Received data:', data); // Debug log
                    
                    // Handle clock-in response
                    if (currentAction === 'clockIn' && data.uid) {
                        updateEmployeeInfo(data);
                    }
                    // Handle clock-out response
                    else if (currentAction === 'clockOut' && data.status === 'success' && data.data) {
                        updateEmployeeInfo(data.data);
                    }
                    // Handle error responses
                    else if (data.status === 'error') {
                        showErrorState(data.message);
                    }
                })
                .catch(error => {
                    console.error('Error polling for updates:', error);
                });
        }

        // Start polling when the page loads
        setInterval(pollForUpdates, 1000);
    </script>
</body>
</html>
