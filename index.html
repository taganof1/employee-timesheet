<!--Frontend page for employees to see when capturing attendance -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Clock-In System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="clock-in-container">
            <h1 class="text-center mb-4">Employee Clock-In System</h1>
            
            <div class="card status-card mb-4">
                <div class="card-body text-center">
                    <i class="fas fa-id-card card-icon text-primary"></i>
                    <h3 class="card-title">Ready to Clock In</h3>
                    <p class="card-text">Please tap your RFID card on the reader</p>
                </div>
            </div>

            <div class="card employee-info">
                <div class="card-body">
                    <h4 class="card-title">Employee Information</h4>
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Employee ID:</strong> <span id="employeeId"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Name:</strong> <span id="employeeName"></span></p>
                        </div>
                    </div>
                    <p><strong>Time:</strong> <span id="clockInTime"></span></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
