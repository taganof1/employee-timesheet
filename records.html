<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Records - Clocking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .records-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .table-responsive {
            margin-top: 20px;
        }
        .back-button {
            margin-bottom: 20px;
        }
        .login-form {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .records-content {
            display: none;
        }
        .records-content.show {
            display: block;
        }
        .login-form.show {
            display: block;
        }
        .login-form.hide {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div class="login-form" id="loginForm">
            <h2 class="text-center mb-4">Authentication Required</h2>
            <div class="alert alert-danger" id="errorMessage" style="display: none;"></div>
            <form id="passwordForm" onsubmit="return verifyPassword(event)">
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Login</button>
                    <a href="index.html" class="btn btn-secondary">Back to Clock-In</a>
                </div>
            </form>
        </div>

        <!-- Records Content -->
        <div class="records-container records-content" id="recordsContent">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="mb-0">Employee Records</h1>
                <div>
                    <button class="btn btn-danger me-2" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                    <a href="index.html" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Back to Clock-In
                    </a>
                </div>
            </div>
            
            <div class="table-responsive">
                <div class="mb-3">
                    <button id="deleteSelectedBtn" class="btn btn-danger" disabled>
                        <i class="fas fa-trash"></i> Delete Selected
                    </button>
                </div>
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th><input type="checkbox" id="selectAll"></th>
                            <th>ID</th>
                            <th>UID</th>
                            <th>Employee ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Clocked In At</th>
                            <th>Clocked Out At</th>
                            <th>Shift Duration</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTableBody">
                        <!-- Records will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit Record Modal -->
    <div class="modal fade" id="editRecordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Record</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editRecordForm">
                        <input type="hidden" id="editRecordId">
                        <div class="mb-3">
                            <label for="editEmployeeId" class="form-label">Employee ID</label>
                            <input type="text" class="form-control" id="editEmployeeId" required>
                        </div>
                        <div class="mb-3">
                            <label for="editFirstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="editFirstName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editLastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="editLastName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editClockedInAt" class="form-label">Clocked In At</label>
                            <input type="datetime-local" class="form-control" id="editClockedInAt" required>
                        </div>
                        <div class="mb-3">
                            <label for="editClockedOutAt" class="form-label">Clocked Out At</label>
                            <input type="datetime-local" class="form-control" id="editClockedOutAt">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveRecord()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function verifyPassword(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            fetch('api/fetch_records.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ password: password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('loginForm').classList.remove('show');
                    document.getElementById('loginForm').classList.add('hide');
                    document.getElementById('recordsContent').classList.add('show');
                    loadRecords();
                } else {
                    errorMessage.textContent = data.message || 'Invalid password';
                    errorMessage.style.display = 'block';
                }
            })
            .catch(error => {
                errorMessage.textContent = 'An error occurred. Please try again.';
                errorMessage.style.display = 'block';
            });

            return false;
        }

        function logout() {
            fetch('includes/logout.php')
            .then(() => {
                document.getElementById('loginForm').classList.remove('hide');
                document.getElementById('loginForm').classList.add('show');
                document.getElementById('recordsContent').classList.remove('show');
                document.getElementById('password').value = '';
                document.getElementById('errorMessage').style.display = 'none';
            });
        }

        let selectedRecords = new Set();
        const editModal = new bootstrap.Modal(document.getElementById('editRecordModal'));

        // Function to handle checkbox selection
        function handleCheckboxChange(checkbox, recordId) {
            if (checkbox.checked) {
                selectedRecords.add(recordId);
            } else {
                selectedRecords.delete(recordId);
            }
            document.getElementById('deleteSelectedBtn').disabled = selectedRecords.size === 0;
        }

        // Function to handle select all checkbox
        document.getElementById('selectAll').addEventListener('change', function(e) {
            const checkboxes = document.querySelectorAll('input[type="checkbox"][name="recordCheckbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = e.target.checked;
                handleCheckboxChange(checkbox, checkbox.value);
            });
        });

        // Function to delete selected records
        function deleteSelectedRecords() {
            if (selectedRecords.size === 0) return;
            
            if (!confirm(`Are you sure you want to delete ${selectedRecords.size} record(s)?`)) {
                return;
            }

            fetch('api/delete_records.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ recordIds: Array.from(selectedRecords) })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    loadRecords();
                    selectedRecords.clear();
                    document.getElementById('deleteSelectedBtn').disabled = true;
                    document.getElementById('selectAll').checked = false;
                } else {
                    alert('Error deleting records: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error deleting records');
            });
        }

        // Function to edit a record
        function editRecord(id, employeeId, firstName, lastName, clockedInAt, clockedOutAt) {
            document.getElementById('editRecordId').value = id;
            document.getElementById('editEmployeeId').value = employeeId;
            document.getElementById('editFirstName').value = firstName;
            document.getElementById('editLastName').value = lastName;
            document.getElementById('editClockedInAt').value = clockedInAt.replace(' ', 'T');
            document.getElementById('editClockedOutAt').value = clockedOutAt ? clockedOutAt.replace(' ', 'T') : '';
            editModal.show();
        }

        // Function to save edited record
        function saveRecord() {
            const recordId = document.getElementById('editRecordId').value;
            const data = {
                employee_id: document.getElementById('editEmployeeId').value,
                first_name: document.getElementById('editFirstName').value,
                last_name: document.getElementById('editLastName').value,
                clocked_in_at: document.getElementById('editClockedInAt').value.replace('T', ' '),
                clocked_out_at: document.getElementById('editClockedOutAt').value ? document.getElementById('editClockedOutAt').value.replace('T', ' ') : null
            };

            fetch(`api/update_record.php?id=${recordId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    editModal.hide();
                    loadRecords();
                } else {
                    alert('Error updating record: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error updating record');
            });
        }

        // Function to clock out a record
        function clockOutRecord(recordId) {
            fetch(`api/clock_out_record.php?id=${recordId}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    loadRecords();
                } else {
                    alert('Error clocking out: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error clocking out');
            });
        }

        // Modified loadRecords function to include new features
        function loadRecords() {
            fetch('api/fetch_records.php')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Unauthorized');
                    }
                    return response.json();
                })
                .then(records => {
                    const tableBody = document.getElementById('recordsTableBody');
                    tableBody.innerHTML = '';
                    
                    records.forEach(record => {
                        const row = document.createElement('tr');
                        const clockInTime = new Date(record.clocked_in_at);
                        const clockOutTime = record.clocked_out_at ? new Date(record.clocked_out_at) : null;
                        const duration = clockOutTime ? formatDuration(clockOutTime - clockInTime) : null;

                        row.innerHTML = `
                            <td><input type="checkbox" name="recordCheckbox" value="${record.id}" onchange="handleCheckboxChange(this, ${record.id})"></td>
                            <td>${record.id}</td>
                            <td>${record.uid}</td>
                            <td>${record.employee_id}</td>
                            <td>${record.first_name}</td>
                            <td>${record.last_name}</td>
                            <td>${clockInTime.toLocaleString()}</td>
                            <td>${clockOutTime ? clockOutTime.toLocaleString() : 'Not clocked out'}</td>
                            <td>${duration || 'In progress'}</td>
                            <td>
                                <button class="btn btn-sm btn-primary me-1" onclick="editRecord(${record.id}, '${record.employee_id}', '${record.first_name}', '${record.last_name}', '${record.clocked_in_at}', '${record.clocked_out_at || ''}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                                ${!clockOutTime ? `
                                    <button class="btn btn-sm btn-success" onclick="clockOutRecord(${record.id})">
                                        <i class="fas fa-sign-out-alt"></i>
                                    </button>
                                ` : ''}
                            </td>
                        `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => {
                    if (error.message === 'Unauthorized') {
                        document.getElementById('loginForm').classList.remove('hide');
                        document.getElementById('loginForm').classList.add('show');
                        document.getElementById('recordsContent').classList.remove('show');
                        document.getElementById('errorMessage').textContent = 'Session expired. Please login again.';
                        document.getElementById('errorMessage').style.display = 'block';
                    } else {
                        console.error('Error loading records:', error);
                        alert('Error loading records. Please try again later.');
                    }
                });
        }

        // Helper function to format duration
        function formatDuration(ms) {
            const hours = Math.floor(ms / (1000 * 60 * 60));
            const minutes = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
            return `${hours}h ${minutes}m`;
        }

        // Add event listener for delete button
        document.getElementById('deleteSelectedBtn').addEventListener('click', deleteSelectedRecords);
    </script>
</body>
</html>
